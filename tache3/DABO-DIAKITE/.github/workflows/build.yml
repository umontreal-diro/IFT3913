name: build-and-mutation-guard

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      # --- Détections robustes ---
      - name: Detect Maven project & wrapper
        id: detect
        run: |
          if [ -f "pom.xml" ]; then echo "has_pom=true" >> "$GITHUB_OUTPUT"; else echo "has_pom=false" >> "$GITHUB_OUTPUT"; fi
          if [ -x "./mvnw" ]; then echo "mvn_cmd=./mvnw" >> "$GITHUB_OUTPUT"; else echo "mvn_cmd=mvn" >> "$GITHUB_OUTPUT"; fi

      - name: Install Maven (no wrapper)
        if: steps.detect.outputs.has_pom == 'true' && steps.detect.outputs.mvn_cmd == 'mvn'
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      # --- Build & tests ---
      - name: Build & unit tests
        if: steps.detect.outputs.has_pom == 'true'
        run: ${{ steps.detect.outputs.mvn_cmd }} -q -DskipTests=false -DfailIfNoTests=false test

      # --- PIT + score ---
      - name: Run PIT (XML output)
        if: steps.detect.outputs.has_pom == 'true'
        run: |
          ${{ steps.detect.outputs.mvn_cmd }} -q -DwithHistory \
            -Dpitest.reportDir=target/pit-reports \
            -Dpitest.outputFormats=XML \
            org.pitest:pitest-maven:mutationCoverage

          total=$(grep -o "<mutation " target/pit-reports/*/mutations.xml | wc -l | tr -d ' ')
          killed=$(grep -o 'killed="true"' target/pit-reports/*/mutations.xml | wc -l | tr -d ' ')
          if [ "$total" = "0" ]; then
            echo "0.00" > mutation_score.txt
          else
            awk -v k="$killed" -v t="$total" 'BEGIN { printf("%.2f\n", 100.0*k/t) }' > mutation_score.txt
          fi
          echo "Current mutation score: $(cat mutation_score.txt)%"

      - name: Install jq & unzip
        if: steps.detect.outputs.has_pom == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq unzip

      # --- On compare au dernier run RÉUSSI de la branche de base (main par défaut) ---
      - name: Download previous score artifact (if exists on base branch)
        if: steps.detect.outputs.has_pom == 'true'
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          RUN_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs?branch=${BASE_BRANCH}&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "BASELINE" > previous_score.txt
            exit 0
          fi

          ART_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            | jq -r '.artifacts[] | select(.name=="mutation-score") | .id // empty')

          if [ -z "$ART_ID" ]; then
            echo "BASELINE" > previous_score.txt
            exit 0
          fi

          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID/zip" -o prev.zip

          unzip -o prev.zip -d prev >/dev/null 2>&1 || true
          if [ -f prev/mutation_score.txt ]; then
            mv prev/mutation_score.txt previous_score.txt
          else
            echo "BASELINE" > previous_score.txt
          fi
          echo "Previous score: $(cat previous_score.txt)"

      - name: Compare scores and fail on regression
        if: steps.detect.outputs.has_pom == 'true'
        run: |
          CUR=$(cat mutation_score.txt)
          PREV=$(cat previous_score.txt)
          if [ "$PREV" = "BASELINE" ]; then
            echo "No previous score on ${BASE_BRANCH} → baseline accepted (${CUR}%)."
            exit 0
          fi
          echo "Previous: ${PREV}%  |  Current: ${CUR}%"
          # tolérance 0.05 point
          awk -v prev="$PREV" -v cur="$CUR" 'BEGIN { if (cur + 0.05 < prev) exit 1; else exit 0 }'

      - name: Upload mutation-score artifact
        if: steps.detect.outputs.has_pom == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation_score.txt
          retention-days: 30

      - name: Skip (no Maven project here)
        if: steps.detect.outputs.has_pom == 'false'
        run: |
          echo "No pom.xml at repo root; skipping build and PIT."
          echo "This job is meant to run on the GraphHopper fork."

      # --- Rickroll propre dans le Job Summary, seulement si ça a échoué ---
      - name: Rickroll humour
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Oops… tests KO 
          ![Never Gonna Give You Up](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)  
          [♪ Never Gonna Give You Up ♪](https://www.youtube.com/watch?v=dQw4w9WgXcQ)
          MD
