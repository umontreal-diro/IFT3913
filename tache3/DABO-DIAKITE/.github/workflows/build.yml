name: build-and-mutation-guard
on: [push, pull_request]
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven
        run: sudo apt-get update -y && sudo apt-get install -y maven

      - name: Build & test
        run: mvn -q -DskipTests=false -DfailIfNoTests=false test

      - name: Run PIT (mutation testing)
        run: |
          mvn -q -DwithHistory -Dpitest.reportDir=target/pit-reports -Dpitest.outputFormats=XML org.pitest:pitest-maven:mutationCoverage
          REPORT=$(find target/pit-reports -name "mutations.xml" | head -n 1)
          total=$(grep -o "<mutation " "$REPORT" | wc -l || echo 0)
          killed=$(grep -o 'killed="true"' "$REPORT" | wc -l || echo 0)
          if [ "$total" -eq 0 ]; then echo "0.00" > mutation_score.txt; else awk -v k="$killed" -v t="$total" 'BEGIN{printf("%.2f\n",100.0*k/t)}' > mutation_score.txt; fi
          echo "Current mutation score: $(cat mutation_score.txt)%"

      - name: Fail if score < baseline
        run: |
          CUR=$(cat mutation_score.txt | tr -d '%[:space:]')
          BASE=$(cat ci/mutation_baseline.txt | tr -d '%[:space:]')
          echo "Baseline: ${BASE}% | Current: ${CUR}%"
          awk -v b="$BASE" -v c="$CUR" 'BEGIN{ if (c+0.05<b) {print "Mutation score dropped below baseline"; exit 1} else {print "Score OK"}}'

      - name: Update baseline if improved
        if: github.ref_name == 'main'
        run: |
          CUR=$(cat mutation_score.txt | tr -d '%[:space:]')
          BASE=$(cat ci/mutation_baseline.txt | tr -d '%[:space:]')
          if (( $(echo "$CUR > $BASE" | bc -l) )); then
            echo "$CUR" > ci/mutation_baseline.txt
            git config user.name "gh-bot"
            git config user.email "bot@users.noreply.github.com"
            git add ci/mutation_baseline.txt
            git commit -m "ci: update mutation baseline to ${CUR}% [skip ci]" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation_score.txt
          retention-days: 30

      - name: Rickroll (if failed)
        if: failure()
        run: |
          echo "Build failed... time for a break!"
          echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
