name: Vérifier les inscriptions

on:
  schedule:
    # noon Montreal time
    - cron: '0 16 * 9-10 *' 
    - cron: '0 17 * 11-12 *'
  workflow_dispatch: {}

jobs:
  verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # fetch the list of students enrolled in the course
      - name: Récupérer les étudiants inscrits au cours
        env:
          STUDIUM_TOKEN: ${{ secrets.STUDIUM_TOKEN }}
        run: |
          set -euo pipefail

          curl -sf -X POST "https://studium-uat.umontreal.ca/webservice/rest/server.php" \
            --data-urlencode "wstoken=$STUDIUM_TOKEN" \
            --data-urlencode "wsfunction=core_enrol_get_enrolled_users" \
            --data-urlencode "moodlewsrestformat=json" \
            --data-urlencode "courseid=349530" \
            --data-urlencode "options[0][name]=userfields" \
            --data-urlencode "options[0][value]=firstname,lastname,email,customfields" \
            -o enrolled.json

          # Extract github_id and fullname (one line per student with a GitHub ID)
          jq -r '.[] |
            ((.customfields // [])[] | select(.shortname == "github") | .value) as $gh |
            select($gh != null and $gh != "") |
            "\($gh)\t\(.fullname)"
          ' enrolled.json > students.tsv

          echo "Étudiants avec GitHub ID : $(wc -l < students.tsv)"

      # task 1 — presentations
      # We use git blame to find the SHA of the commit that filled each
      # "- Nom:" line, then look up the PR to get the PR author
      # (not the merge author).
      - name: Vérifier tâche 1 (présentations)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Cache SHA → PR author, to avoid repeated API calls
          declare -A sha_cache

          resolve_author() {
            local sha="$1"
            if [[ -z "${sha_cache[$sha]+x}" ]]; then
              # First, look for the PR associated with the commit
              local author
              author=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                --jq '.[0].user.login // empty' 2>/dev/null || true)
              # If no PR found (direct push), fall back to commit author
              if [[ -z "$author" ]]; then
                author=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
                  --jq '.author.login // empty' 2>/dev/null || true)
              fi
              sha_cache["$sha"]="$author"
            fi
            echo "${sha_cache[$sha]}"
          }

          declare -A registered

          for readme in presentations/Semaine*/readme.md; do
            [[ -f "$readme" ]] || continue
            current_sha=""

            while IFS= read -r line; do
              # Porcelain header: SHA followed by line numbers
              if [[ "$line" =~ ^([0-9a-f]{40})[[:space:]] ]]; then
                current_sha="${BASH_REMATCH[1]}"
              fi
              # Content line (starts with a tab)
              if [[ "${line:0:1}" == $'\t' ]]; then
                content="${line:1}"
                # Filled "- Nom:" line (not empty)
                if echo "$content" | grep -qE '^-[[:space:]]*Nom:[[:space:]]*\S'; then
                  author=$(resolve_author "$current_sha")
                  [[ -n "$author" ]] && registered["$author"]=1
                fi
              fi
            done < <(git blame --porcelain "$readme")
          done

          # Save registered GitHub IDs (lowercased for consistent matching)
          : > tache1_registered.txt
          for id in "${!registered[@]}"; do
            echo "$id" | tr '[:upper:]' '[:lower:]' >> tache1_registered.txt
          done
          sort -fo tache1_registered.txt tache1_registered.txt
          echo "Tâche 1 inscrits : $(wc -l < tache1_registered.txt)"

          # Per-week table (simple grep)
          echo "semaine,inscrits,liens" > tache1_weekly.csv
          for readme in presentations/Semaine*/readme.md; do
            [[ -f "$readme" ]] || continue
            sem=$(basename "$(dirname "$readme")")
            reg=$(grep -cE '^-[[:space:]]*Nom:[[:space:]]*\S' "$readme") || true
            links=$(grep -cE '^-[[:space:]]*Présentation:[[:space:]]+\S' "$readme") || true
            echo "${sem},${reg},${links}" >> tache1_weekly.csv
          done

      # task 2
      # A pair is "registered" when their folder contains a readme with
      # both real GitHub links.
      # We collect the GitHub IDs of both members.
      - name: Vérifier tâche 2
        run: |
          set -euo pipefail

          declare -A registered
          : > tache2_registered.txt

          for dir in tache2/*/; do
            [[ -d "$dir" ]] || continue

            readme=""
            [[ -f "$dir/readme.md" ]] && readme="$dir/readme.md"
            [[ -f "$dir/README.md" ]] && readme="$dir/README.md"
            [[ -n "$readme" ]] || continue

            # Check that both GitHub links are present and real
            repo_link=$(sed -n 's/^- Lien vers le répertoire GitHub : *//p' "$readme")
            readme_link=$(sed -n 's/^- Lien vers le README du répertoire : *//p' "$readme")

            if ! echo "$repo_link" | grep -qE '^https://github\.com/.+/.+'; then continue; fi
            if ! echo "$readme_link" | grep -qE '^https://github\.com/.+/.+'; then continue; fi

            # Extract both team members' GitHub IDs from the table
            while IFS= read -r row; do
              gh_id=$(echo "$row" | awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3}')
              if echo "$gh_id" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
                registered["$gh_id"]=1
              fi
            done < <(grep -E '^\|' "$readme" \
              | grep -vE '^\|[[:space:]]*Nom' \
              | grep -vE '^\|[-[:space:]:]*\|[-[:space:]:]*\|$')
          done

          for id in "${!registered[@]}"; do
            echo "$id" | tr '[:upper:]' '[:lower:]' >> tache2_registered.txt
          done
          sort -fo tache2_registered.txt tache2_registered.txt
          echo "Tâche 2 inscrits : $(wc -l < tache2_registered.txt)"

      # task 3 (same as task 2)
      - name: Vérifier tâche 3
        run: |
          set -euo pipefail

          declare -A registered
          : > tache3_registered.txt

          for dir in tache3/*/; do
            [[ -d "$dir" ]] || continue

            readme=""
            [[ -f "$dir/readme.md" ]] && readme="$dir/readme.md"
            [[ -f "$dir/README.md" ]] && readme="$dir/README.md"
            [[ -n "$readme" ]] || continue

            repo_link=$(sed -n 's/^- Lien vers le répertoire GitHub : *//p' "$readme")
            readme_link=$(sed -n 's/^- Lien vers le README du répertoire : *//p' "$readme")

            if ! echo "$repo_link" | grep -qE '^https://github\.com/.+/.+'; then continue; fi
            if ! echo "$readme_link" | grep -qE '^https://github\.com/.+/.+'; then continue; fi

            while IFS= read -r row; do
              gh_id=$(echo "$row" | awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3}')
              if echo "$gh_id" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
                registered["$gh_id"]=1
              fi
            done < <(grep -E '^\|' "$readme" \
              | grep -vE '^\|[[:space:]]*Nom' \
              | grep -vE '^\|[-[:space:]:]*\|[-[:space:]:]*\|$')
          done

          for id in "${!registered[@]}"; do
            echo "$id" | tr '[:upper:]' '[:lower:]' >> tache3_registered.txt
          done
          sort -fo tache3_registered.txt tache3_registered.txt
          echo "Tâche 3 inscrits : $(wc -l < tache3_registered.txt)"

      # generate submissions.md
      - name: Générer submissions.md
        run: |
          set -euo pipefail

          DATE=$(TZ='America/Montreal' date '+%y.%m.%d')

          # Load enrolled students
          # Compare in lowercase but display original case
          declare -A enrolled  # lowercase → original
          while IFS=$'\t' read -r gh_id fullname; do
            key=$(echo "$gh_id" | tr '[:upper:]' '[:lower:]')
            enrolled["$key"]="$gh_id"
          done < students.tsv

          # Load each task's results (already lowercased in the registered files)
          declare -A t1 t2 t3
          while IFS= read -r id; do [[ -n "$id" ]] && t1["$id"]=1; done < tache1_registered.txt
          while IFS= read -r id; do [[ -n "$id" ]] && t2["$id"]=1; done < tache2_registered.txt
          while IFS= read -r id; do [[ -n "$id" ]] && t3["$id"]=1; done < tache3_registered.txt

          # Log GitHub IDs found in readmes that don't match any enrolled student
          find_unmatched() {
            local task_name=$1
            local -n reg=$2
            local unmatched=""
            for key in "${!reg[@]}"; do
              if [[ -z "${enrolled[$key]+x}" ]]; then
                unmatched="${unmatched:+$unmatched, }$key"
              fi
            done
            if [[ -n "$unmatched" ]]; then
              echo "::warning::${task_name}: GitHub IDs in readmes but not in enrolled students: ${unmatched}"
            fi
          }
          find_unmatched "tâche 1" t1
          find_unmatched "tâche 2" t2
          find_unmatched "tâche 3" t3

          # Build registered / not-registered lists for a given task
          build_lists() {
            local -n reg_map=$1
            local inscrits="" non_inscrits=""
            for key in $(printf '%s\n' "${!enrolled[@]}" | sort); do
              local orig="${enrolled[$key]}"
              if [[ -n "${reg_map[$key]+x}" ]]; then
                inscrits="${inscrits:+$inscrits; }$orig"
              else
                non_inscrits="${non_inscrits:+$non_inscrits; }$orig"
              fi
            done
            # Two lines: registered then not-registered
            echo "$inscrits"
            echo "$non_inscrits"
          }

          OUT="submissions.md"

          {
            echo "mise à jour: ${DATE}"
            echo ""
            echo ""
            echo "# Inscriptions tâche 1:"
            echo ""

            # Per-week table
            echo "| Semaine | Inscrits | Liens soumis |"
            echo "|---------|----------|-------------|"
            tail -n +2 tache1_weekly.csv | while IFS=',' read -r sem reg links; do
              echo "| ${sem} | ${reg} | ${links} |"
            done
            total_reg=$(awk -F',' 'NR>1{s+=$2}END{print s+0}' tache1_weekly.csv)
            total_links=$(awk -F',' 'NR>1{s+=$3}END{print s+0}' tache1_weekly.csv)
            echo "| **Total** | **${total_reg}** | **${total_links}** |"
            echo ""

            readarray -t lists < <(build_lists t1)
            echo "inscrits : ${lists[0]}"
            echo ""
            echo "non-inscrits : ${lists[1]}"
            echo ""
            echo ""
            echo "# Inscriptions tâche 2:"
            echo ""
            echo "nombre: $(wc -l < tache2_registered.txt | tr -d ' ')"
            echo ""

            readarray -t lists < <(build_lists t2)
            echo "inscrits : ${lists[0]}"
            echo ""
            echo "non-inscrits : ${lists[1]}"
            echo ""
            echo ""
            echo "# Inscriptions tâche 3:"
            echo ""
            echo "nombre: $(wc -l < tache3_registered.txt | tr -d ' ')"
            echo ""

            readarray -t lists < <(build_lists t3)
            echo "inscrits : ${lists[0]}"
            echo ""
            echo "non-inscrits : ${lists[1]}"
          } > "$OUT"

          echo "--- submissions.md ---"
          cat "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      # commit and push
      - name: Commit submissions.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions.md
          git diff --cached --quiet && echo "Aucun changement à commit" && exit 0
          git commit -m "mise à jour submissions.md"
          git push
