name: Validation des soumissions tâche 2

on:
  pull_request_target:
    paths:
      - 'tache2/*/readme.md'
      - 'tache2/*/README.md'

jobs:
  valider-et-approuver:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Vérifier si la PR est trop tôt
        id: check-early
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          PR_CREATED="${{ github.event.pull_request.created_at }}"
          CREATED_EPOCH=$(date -d "$PR_CREATED" +%s)
          # 4 days before Oct 06 = Oct 02 00:00 EDT = Oct 02 04:00 UTC
          EARLIEST_EPOCH=$(date -d "2026-10-02T04:00:00Z" +%s)

          if [ "$CREATED_EPOCH" -lt "$EARLIEST_EPOCH" ]; then
            echo "too_early=true" >> $GITHUB_OUTPUT
          else
            echo "too_early=false" >> $GITHUB_OUTPUT
          fi

      - name: Fermer la PR trop tôt
        if: steps.check-early.outputs.too_early == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⏰ Cette PR a été soumise trop tôt.

          Les soumissions pour la tâche 2 sont acceptées à partir du **2 octobre 2026**.

          La PR est automatiquement fermée. Veuillez soumettre à nouveau après cette date."

          gh pr close ${{ github.event.pull_request.number }}

      - name: Checkout
        if: steps.check-early.outputs.too_early == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Obtenir les fichiers modifiés
        if: steps.check-early.outputs.too_early == 'false'
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            tache2/*/readme.md
            tache2/*/README.md
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Valider les changements
        if: steps.check-early.outputs.too_early == 'false'
        id: validate
        run: |
          set -e

          all_changed="${{ steps.changed-files.outputs.all_changed_files }}"
          all_added="${{ steps.changed-files.outputs.added_files }}"
          all_modified="${{ steps.changed-files.outputs.modified_files }}"

          IFS=' ' read -ra changed_files <<< "$all_changed"

          # Must change exactly one file
          if [ ${#changed_files[@]} -ne 1 ]; then
            echo "error=Un seul fichier readme doit être modifié par PR." >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          file="${changed_files[0]}"

          # Must be inside tache2/SUBFOLDER/readme.md (case-insensitive)
          if [[ ! "$file" =~ ^tache2/[^/]+/[Rr][Ee][Aa][Dd][Mm][Ee]\.[Mm][Dd]$ ]]; then
            echo "error=Le fichier doit être dans un sous-dossier de tache2/ (ex: tache2/NOM1-NOM2/readme.md)." >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine if this is a new file or an update to an existing one
          is_new=false
          if echo "$all_added" | grep -q "$file"; then
            is_new=true
          fi

          content=$(cat "$file")

          # --- Validate the strict template format ---

          # Check for the table header
          if ! echo "$content" | grep -qE '^\|[[:space:]]*\|[[:space:]]*Nom complet[[:space:]]*\|[[:space:]]*Matricule[[:space:]]*\|'; then
            echo "error=Le format du tableau n'est pas respecté. Veuillez suivre le TEMPLATE.md." >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract member rows (lines starting with | Membre)
          member_lines=$(echo "$content" | grep -E '^\|[[:space:]]*Membre [12]')
          member_count=$(echo "$member_lines" | grep -c '.' || true)

          if [ "$member_count" -lt 1 ]; then
            echo "error=Au moins un membre doit être renseigné dans le tableau." >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Validate each member row has non-placeholder name and matricule
          valid_members=true
          error_detail=""
          while IFS= read -r line; do
            # Extract name (2nd column) and matricule (3rd column)
            name_val=$(echo "$line" | awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3}')
            mat_val=$(echo "$line" | awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $4); print $4}')

            # Check name is not empty or placeholder
            if [ -z "$name_val" ] || [ "$name_val" = "NOM Prénom" ]; then
              valid_members=false
              error_detail="Le nom complet doit être renseigné pour chaque membre (pas de valeur vide ou placeholder)."
              break
            fi

            # Check matricule is not empty or placeholder and is numeric
            if [ -z "$mat_val" ] || [ "$mat_val" = "00000000" ]; then
              valid_members=false
              error_detail="Le matricule doit être renseigné pour chaque membre (pas de valeur vide ou placeholder)."
              break
            fi

            if ! echo "$mat_val" | grep -qE '^[0-9]+$'; then
              valid_members=false
              error_detail="Le matricule doit être numérique."
              break
            fi
          done <<< "$member_lines"

          if [ "$valid_members" = false ]; then
            echo "error=$error_detail" >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check links section exists (the labels must be present even if values are empty)
          if ! echo "$content" | grep -qE '^- Lien vers le répertoire GitHub :'; then
            echo "error=La section 'Lien vers le répertoire GitHub :' est manquante." >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! echo "$content" | grep -qE '^- Lien vers le README du répertoire :'; then
            echo "error=La section 'Lien vers le README du répertoire :' est manquante." >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For NEW files: links are optional (values can be empty)
          # For MODIFIED files (updates): only the links section should change
          if [ "$is_new" = false ]; then
            # This is an update — only the links section should change
            diff_output=$(git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$file")

            added_lines=$(echo "$diff_output" | grep "^+" | grep -v "^+++" | sed 's/^+//')
            removed_lines=$(echo "$diff_output" | grep "^-" | grep -v "^---" | sed 's/^-//')

            links_only=true
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                if ! echo "$line" | grep -qE '^- Lien vers le (répertoire GitHub|README du répertoire) :'; then
                  links_only=false
                  break
                fi
              fi
            done <<< "$added_lines"

            if [ "$links_only" = true ]; then
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  if ! echo "$line" | grep -qE '^- Lien vers le (répertoire GitHub|README du répertoire) :'; then
                    links_only=false
                    break
                  fi
                fi
              done <<< "$removed_lines"
            fi

            if [ "$links_only" = false ]; then
              echo "error=Pour une mise à jour, seuls les liens peuvent être modifiés. Les noms et matricules ne doivent pas changer." >> $GITHUB_OUTPUT
              echo "valid=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            # If links are present, validate they are GitHub URLs
            repo_link=$(echo "$content" | grep -E '^- Lien vers le répertoire GitHub :' | sed 's/^- Lien vers le répertoire GitHub :[[:space:]]*//')
            readme_link=$(echo "$content" | grep -E '^- Lien vers le README du répertoire :' | sed 's/^- Lien vers le README du répertoire :[[:space:]]*//')

            if [ -n "$repo_link" ]; then
              if ! echo "$repo_link" | grep -qE '^https://github\.com/'; then
                echo "error=Le lien du répertoire doit être un lien GitHub (https://github.com/...)." >> $GITHUB_OUTPUT
                echo "valid=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi

            if [ -n "$readme_link" ]; then
              if ! echo "$readme_link" | grep -qE '^https://github\.com/'; then
                echo "error=Le lien du README doit être un lien GitHub (https://github.com/...)." >> $GITHUB_OUTPUT
                echo "valid=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi

          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Approuver et fusionner
        if: steps.check-early.outputs.too_early == 'false' && steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "Auto-approuvé ✅. Le format du readme est valide."
          gh pr merge ${{ github.event.pull_request.number }} --squash

      - name: Commenter et fermer la PR invalide
        if: steps.check-early.outputs.too_early == 'false' && steps.validate.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ Cette PR ne peut pas être auto-approuvée.

          **Raison :** ${{ steps.validate.outputs.error }}

          **Format attendu :** veuillez suivre exactement le modèle dans [\`tache2/TEMPLATE.md\`](../blob/main/tache2/TEMPLATE.md).

          **Règles :**
          1. Le fichier doit être dans \`tache2/NOM1-NOM2/readme.md\`
          2. Le format du tableau avec noms complets et matricules doit être respecté
          3. Les liens peuvent être ajoutés dans une PR séparée

          La PR est automatiquement fermée. Veuillez corriger et soumettre une nouvelle PR."

          gh pr close ${{ github.event.pull_request.number }}
